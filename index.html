<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Principal -->
    <title>BookFinder - Descubre y Organiza tu Biblioteca Personal</title>
    <meta
      name="description"
      content="Descubre, organiza y gestiona tu biblioteca personal. Encuentra tu próxima lectura favorita, guarda tus libros favoritos y lleva un registro de tus lecturas."
    />
    <meta
      name="keywords"
      content="libros, biblioteca personal, lectura, recomendaciones de libros, gestión de libros, organizar libros"
    />
    <meta name="author" content="BookFinder" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookfinder.com/" />
    <meta
      property="og:title"
      content="BookFinder - Descubre y Organiza tu Biblioteca Personal"
    />

      property="og:description"
      content="Descubre, organiza y gestiona tu biblioteca personal. Encuentra tu próxima lectura favorita."
    />
    <meta property="og:image" content="https://bookfinder.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bookfinder.com/" />
    <meta
      property="twitter:title"
      content="BookFinder - Descubre y Organiza tu Biblioteca Personal"
    />
    <meta
      property="twitter:description"
      content="Descubre, organiza y gestiona tu biblioteca personal. Encuentra tu próxima lectura favorita."
    />
    <meta
      property="twitter:image"
      content="https://bookfinder.com/twitter-image.jpg"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Tema del navegador -->
    <meta name="theme-color" content="#9333ea" />
